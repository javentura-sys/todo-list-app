<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mini Lista de Tareas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <h1>Mi Lista de Tareas</h1>
    <div class="input-row">
      <input id="taskInput" placeholder="Nueva tarea...">
      <button id="addBtn">Agregar</button>
    </div>
    <div class="filters">
      <button data-filter="all">Todas</button>
      <button data-filter="pending">Pendientes</button>
      <button data-filter="done">Completadas</button>
    </div>
    <ul id="taskList"></ul>
  </div>
  <script src="script.js"></script>
</body>
</html>
