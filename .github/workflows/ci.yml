name: CI Básico
on: [push]
jobs:
  verificar-archivos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar que existan los archivos clave
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          echo "Todos los archivos requeridos están presentes."